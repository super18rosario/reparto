<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reparto Super 18</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#1b1f27;--mut:#6b7280;--ln:#e5e7eb;--pri:#c8102e;--ok:#16a34a;--warn:#d97706;--gm:#1a73e8;--blue:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1c2027;--tx:#eceef2;--mut:#9ca3af;--ln:#2c323c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:96px}
header{background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;flex:1}
.mode{display:flex;background:rgba(255,255,255,.18);border-radius:10px;padding:3px}
.mode button{background:none;color:#fff;padding:7px 12px;font-size:14px;border-radius:8px}
.mode button.on{background:#fff;color:var(--pri)}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:52px;z-index:4}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 4px;font-weight:600;color:var(--mut)}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{max-width:860px;margin:0 auto;padding:12px}
button,.btn{appearance:none;border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--ln);color:var(--tx);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:disabled{opacity:.45}
.pri{background:var(--pri);color:#fff}.ok{background:var(--ok);color:#fff}.gm{background:var(--gm);color:#fff}.wz{background:#33ccff;color:#04324a}.warn{background:var(--warn);color:#fff}
.w{width:100%}.sm{padding:7px 11px;font-size:14px}.ghost{background:none;color:var(--mut)}
input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:var(--card);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ch{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln)}
.ch b{flex:1}
.cnt{font-size:13px;color:var(--mut);font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--ln)}
.ch+.it,.it:first-child{border-top:0}
.it .b{flex:1;min-width:0}
.it .t{font-weight:600}
.it .d{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{width:30px;height:30px;border-radius:50%;color:#fff;background:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.star{color:#f59e0b}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-no{background:#fee2e2;color:#991b1b}.t-go{background:#dbeafe;color:#1e40af}.t-pe{background:#f3f4f6;color:#374151}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 16px}
.empty div{font-size:42px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:6;display:flex;gap:10px;width:min(836px,calc(100% - 24px))}
.fab button{flex:1;padding:16px;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.panel h3{margin:0 0 6px;font-size:18px;display:flex;align-items:center}
.panel h3 span{flex:1}
.x{background:none;color:var(--mut);padding:6px 8px;font-size:18px}
.cl{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.cl .b{flex:1;min-width:0}.cl .d{font-size:13px;color:var(--mut)}
.chk{width:26px;height:26px;flex:none;accent-color:var(--pri)}
.err{color:#dc2626;font-size:14px;margin-top:6px}
.tip{font-size:13px;color:var(--mut);background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
.banner{background:#fef3c7;color:#713f12;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{padding:4px 9px;font-size:13px}
.drv{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding:16px}
.drv.on{display:flex}
.drv .top{display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:600}
.drv .top span{flex:1}
.bigc{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:8px}
.bigc .k{font-size:15px;color:var(--mut);font-weight:600}
.bigc .nm{font-size:32px;font-weight:800;line-height:1.1}
.bigc .ad{font-size:20px}
.bigc .nt{font-size:17px;background:#fef3c7;color:#713f12;border-radius:10px;padding:8px 12px;align-self:center}
.drv .btns{display:flex;flex-direction:column;gap:10px}
.drv .btns button,.drv .btns a{padding:18px;font-size:20px}
.prog{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
.toast.on{opacity:1}
.hidden{display:none!important}
.sync{font-size:12px;opacity:.85}
.dis{opacity:.45;pointer-events:none}
.lok{font-size:14px;margin-top:6px}
html,body{overscroll-behavior-y:none}
.d2{font-size:14px;margin-top:3px;color:#92400e;white-space:normal}
@media (prefers-color-scheme:dark){.d2{color:#fbbf24}}
textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);resize:vertical}
body.r-reparto .no-rep{display:none!important}
.only-cho{display:none!important}
.only-ofi{display:none!important}
.only-caj{display:none!important}
body.r-cajas .only-caj{display:block!important}
body.r-cajas .no-caj{display:none!important}
.big{font-size:40px;font-weight:800;line-height:1}
body.r-oficina .only-ofi{display:block!important}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(200,16,46,.7)}50%{box-shadow:0 0 0 12px rgba(200,16,46,0)}}
.pulso{animation:pulso 1.2s infinite;background:var(--pri)!important;color:#fff!important}
body.r-chofer .no-cho{display:none!important}
body.r-chofer nav.only-cho{display:flex!important}
body.r-chofer button.only-cho{display:block!important}
#map{height:calc(100vh - 230px);min-height:320px;border-radius:14px;border:1px solid var(--ln)}
.pmap{height:230px;border-radius:12px;margin-top:8px;border:1px solid var(--ln)}
.geo .cl{padding:10px 4px}
.login{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.login.on{display:flex}
.leaflet-container{font:inherit}
</style>
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Reparto">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <h1>🚚 Reparto <span class="sync" id="sync"></span> <span class="sync" id="gps"></span></h1>
  <div class="mode no-rep no-cho no-caj"><button data-mode="ofi">Oficina</button><button data-mode="cho">Chofer</button></div>
</header>

<!-- ================= OFICINA ================= -->
<div id="ofi">
  <nav><button data-tab="rec" class="only-cho">Recorrido</button><button data-tab="ped" class="on no-cho no-caj">Pedidos</button><button data-tab="map" class="no-rep no-caj">Mapa</button><button data-tab="cli">Clientes</button><button data-tab="cfg">Ajustes</button></nav>
  <main>
    <div id="banner"></div>
    <section id="tab-ped">
      <div id="bkBox" class="only-ofi"></div>
      <div class="kpis" id="kpis"></div>
      <div id="ofiLists"></div>
    </section>
    <section id="tab-map" class="hidden">
      <div id="map"></div>
      <p class="cnt" id="mapInfo" style="line-height:1.6"></p>
    </section>
    <section id="tab-cli" class="hidden">
      <div id="cajBox" class="card only-caj" style="padding:16px;text-align:center"></div>
      <div id="cliFix"></div>
      <input id="cliSearch" placeholder="🔍 Buscar cliente">
      <button class="w" id="cliNew" style="margin-top:10px">＋ Cliente nuevo</button>
      <div id="cliList" class="card" style="margin-top:10px"></div>
    </section>
    <section id="tab-cfg" class="hidden">
      <div class="card no-rep no-cho no-caj" style="padding:14px">
        <label style="margin-top:0">Lugar de salida</label><input id="depName">
        <label>Ubicación del lugar de salida</label><input id="depLoc" placeholder="-34.3156, -57.3520">
        <div id="depErr" class="err"></div>
        <div class="row">
          <div><label>Hora de salida</label><input id="cStart" type="time"></div>
          <div><label>Minutos por entrega</label><input id="cStopMin" type="number" min="0" inputmode="numeric"></div>
        </div>
        <div class="row">
          <div><label>Velocidad (km/h)</label><input id="cSpeed" type="number" min="5" inputmode="numeric"></div>
          <div><label>Al terminar</label><select id="cRet"><option value="1">Vuelve al local</option><option value="0">Termina en la última</option></select></div>
        </div>
        <label>💬 Mensaje de WhatsApp al cliente</label><textarea id="cWa" rows="3"></textarea>
        <div class="tip">Podés usar: <b>{cliente}</b> (primer nombre), <b>{nombre_completo}</b>, <b>{chofer}</b> (quien lleva el pedido) y <b>{minutos}</b> (cuánto falta, aprox.).</div>
      </div>
      <div class="card only-ofi" style="padding:14px">
        <b>💾 Respaldo en Excel</b>
        <div class="cnt" id="bkInfo" style="margin:4px 0 10px"></div>
        <button class="w" id="bkGo">Bajar respaldo ahora</button>
        <button class="ghost w sm" id="bkChg" style="margin-top:6px">Cambiar dónde se guarda</button>
      </div>
      <div class="card" style="padding:14px">
        <div class="cnt" id="who"></div>
        <button class="w" id="logout" style="margin-top:10px">Cerrar sesión</button>
      </div>
    </section>
  </main>
  <div class="fab no-cho" id="ofiFab"><button class="pri" id="addOrder">＋ Nuevo pedido</button></div>
</div>

<!-- ================= CHOFER ================= -->
<div id="cho" class="hidden">
  <nav class="only-cho"><button class="on">Recorrido</button><button data-ct="map">Mapa</button><button data-ct="cli">Clientes</button><button data-ct="cfg">Ajustes</button></nav>
  <main>
    <div id="choBody"></div>
  </main>
  <div class="fab" id="choFab"></div>
</div>

<!-- Hojas -->
<div class="sheet" id="sh"><div class="panel" id="shp"></div></div>

<!-- Modo manejo -->
<div class="drv" id="drv">
  <div class="top"><span id="drvTop"></span><button class="sm" id="drvClose">Lista ✕</button></div>
  <div class="prog"><i id="drvProg"></i></div>
  <div class="bigc" id="drvCard"></div>
  <div class="btns" id="drvBtns"></div>
</div>
<div class="toast" id="toast"></div>
<div class="login" id="login"><div class="card" style="padding:18px;max-width:420px;width:100%">
  <h2 style="margin:0 0 4px">🚚 Reparto Super 18</h2><p class="cnt" style="margin:0">Entrá con tu usuario</p>
  <label>Usuario</label><input id="lgE" autocomplete="username" autocapitalize="none" placeholder="Ej: chofer">
  <label>Contraseña</label><input id="lgP" type="password" autocomplete="current-password">
  <div id="lgErr" class="err"></div><button class="pri w" id="lgGo" style="margin-top:14px">Entrar</button>
</div></div>

<script>
/* ============ utilidades ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nm=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const same=(a,b)=>!!a&&!!b&&nm(a)===nm(b);
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'chofer';
const lget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const lset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function toast(t,ms=2200){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms)}
const hhmm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const todayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};

/* ============ ubicación ============ */
const okLL=(a,b)=>isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180&&!(a===0&&b===0);
function parseLoc(s){
  if(!s)return null;s=String(s).trim();try{s=decodeURIComponent(s)}catch(e){}
  let m=s.match(/(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([NS])[\s,]*(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([EWO])/i);
  if(m){let a=+m[1]+m[2]/60+m[3]/3600,b=+m[5]+m[6]/60+m[7]/3600;if(/S/i.test(m[4]))a=-a;if(/[WO]/i.test(m[8]))b=-b;if(okLL(a,b))return{lat:a,lng:b}}
  for(const p of[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/[?&](?:q|query|ll|destination|daddr|center)=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/i,/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/]){m=s.match(p);if(m&&okLL(+m[1],+m[2]))return{lat:+m[1],lng:+m[2]}}
  return null;
}
const failsOf=o=>Array.isArray(o&&o.intentos)?o.intentos:[];
const failEvents=()=>Object.entries(D.orders).flatMap(([id,o])=>failsOf(o).map(f=>({...o,id,status:'no_entregado',driver:f.driver,reason:f.reason,doneAt:f.at,_fail:1})));
const failLine=o=>{const f=failsOf(o);if(!f.length)return'';const l=f[f.length-1];return`<div class="d2" style="color:#dc2626">⚠️ No se pudo entregar ${fmtDay(l.at)} ${hhmm(l.at)} (${esc(l.driver||'')}): ${esc(l.reason||'')}${f.length>1?' · '+f.length+' intentos':''}</div>`};
const msg=o=>(o.hora||o.note)?`<div class="d2">${o.hora?'🕐 '+esc(o.hora)+(o.note?' · ':''):''}${o.note?'📝 '+esc(o.note):''}</div>`:'';
const ic=o=>o&&o.kind==='retiro'?'📥 ':'';
const hasLL=p=>p&&typeof p.lat==='number'&&typeof p.lng==='number';
const fmtLL=p=>hasLL(p)?p.lat.toFixed(6)+', '+p.lng.toFixed(6):'';
const ll=p=>p.lat.toFixed(6)+','+p.lng.toFixed(6);
function navUrl(o){return hasLL(o)?`https://www.google.com/maps/dir/?api=1&destination=${ll(o)}&travelmode=driving`:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent((o.addr||o.name)+', Rosario, Colonia, Uruguay')}&travelmode=driving`}
const mapsSearch=a=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a+', Rosario, Colonia, Uruguay')}`;
function Lmap(el,c,z){const m=window.L.map(el).setView([c.lat,c.lng],z);window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);return m}
async function geocode(q){
  const base='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=uy&accept-language=es&q=';
  const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error('http');return r.json()};
  let r=await get(base+encodeURIComponent(q)+'&viewbox=-57.40,-34.27,-57.30,-34.37&bounded=1');
  if(!r.length)r=await get(base+encodeURIComponent(q+', Rosario, Colonia'));
  return r.map(x=>({lat:+x.lat,lng:+x.lon,label:x.display_name.split(',').slice(0,3).join(','),house:!!(x.address&&x.address.house_number)||x.addresstype==='building'||x.type==='house'}));
}
function hereLoc(ok,bad){if(!navigator.geolocation){bad('Este celular no tiene GPS disponible.');return}
  navigator.geolocation.getCurrentPosition(p=>{sendPos(p);return ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy})},e=>bad(e.code===1?'No diste permiso de ubicación. Activalo en el navegador.':'No pude leer el GPS. Probá de nuevo.'),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function locHelper(aId,lId,mId,okId){
  const A=$(aId),LI=$(lId),B=$(mId),O=$(okId);
  B.removeAttribute('href');B.removeAttribute('target');B.textContent='🔎 Buscar ubicación';
  const box=document.createElement('div');
  box.innerHTML=`<div class="geo"></div><div class="row" style="margin-top:8px"><button class="sm" type="button" data-here>📍 Estoy acá</button><a class="btn sm" data-gm target="_blank" rel="noopener">Ver en Google Maps</a></div><div class="pmap"></div><div class="cnt" style="margin-top:4px">Si el punto no está justo sobre la casa, arrastralo o tocá en el mapa.</div>`;
  B.after(box);
  const G=box.querySelector('.geo'),M=box.querySelector('.pmap'),GM=box.querySelector('[data-gm]');
  let map=null,mk=null;
  function show(p,noMk){
    if(!window.L){M.style.display='none';return}
    if(!map){map=Lmap(M,p,noMk?14:17);map.on('click',e=>setLL({lat:e.latlng.lat,lng:e.latlng.lng}))}
    if(!noMk){if(!mk){mk=window.L.marker([p.lat,p.lng],{draggable:true}).addTo(map);mk.on('dragend',()=>{const q=mk.getLatLng();setLL({lat:q.lat,lng:q.lng},true)})}else mk.setLatLng([p.lat,p.lng]);map.setView([p.lat,p.lng],Math.max(map.getZoom(),17))}
    setTimeout(()=>map.invalidateSize(),80);
  }
  function setLL(p,fromDrag){LI.value=p.lat.toFixed(6)+', '+p.lng.toFixed(6);chk(fromDrag)}
  function chk(fromDrag){const v=LI.value.trim(),p=parseLoc(v);
    GM.href=p?`https://www.google.com/maps/search/?api=1&query=${ll(p)}`:mapsSearch(A.value.trim()||'');
    if(!v){O.innerHTML='';return}
    if(p){O.innerHTML='<span style="color:var(--ok);font-weight:600">✓ Ubicación lista</span>';if(!fromDrag)show(p)}
    else if(/goo\.gl|maps\.app/i.test(v))O.innerHTML='<span style="color:#dc2626">Ese es un link corto y no trae la ubicación.</span>';
    else O.innerHTML='<span style="color:#dc2626">No reconozco esa ubicación.</span>'}
  B.onclick=async()=>{const a=A.value.trim();if(!a){G.innerHTML='<p class="err">Escribí primero la dirección.</p>';A.focus();return}
    G.innerHTML='<p class="cnt">Buscando…</p>';
    try{const r=await geocode(a);
      if(!r.length){G.innerHTML='<p class="err">No la encontré. Probá escribirla distinto (ej. "Artigas 512") o marcá el punto en el mapa.</p>';show(depot(),true);return}
      const pick=i=>{setLL(r[i]);G.innerHTML=r[i].house?'':'<div class="banner" style="margin:8px 0 0">Encontré la calle, no la casa exacta. Mové el punto hasta la casa.</div>'};
      if(r.length===1){pick(0);return}
      G.innerHTML='<p class="cnt" style="margin:8px 0 0">¿Cuál es?</p>'+r.map((x,i)=>`<div class="cl" data-g="${i}"><div class="b">${esc(x.label)}</div></div>`).join('');

function dist(a,b){const r=Math.PI/180,dA=(b.lat-a.lat)*r,dO=(b.lng-a.lng)*r;const x=Math.sin(dA/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dO/2)**2;return 2*6371*Math.asin(Math.sqrt(x))*1.3}
// orden más corto desde "start", visitando pts, terminando en "end" (o donde convenga si end=null)
function solve(start,pts,end){
  const m=pts.length;if(!m)return[];
  const D=(i,j)=>dist(i<0?start:pts[i],pts[j]),E=j=>end?dist(pts[j],end):0;
  if(m<=13){
    const N=1<<m,INF=1e18,dp=new Float64Array(N*m).fill(INF),par=new Int8Array(N*m).fill(-1),dm=[];
    for(let i=0;i<m;i++){dm[i]=[];for(let j=0;j<m;j++)dm[i][j]=D(i,j)}
    for(let j=0;j<m;j++)dp[(1<<j)*m+j]=D(-1,j);
    for(let k=1;k<N;k++)for(let j=0;j<m;j++){const v=dp[k*m+j];if(v>=INF)continue;for(let q=0;q<m;q++){if(k>>q&1)continue;const nk=k|1<<q,nv=v+dm[j][q];if(nv<dp[nk*m+q]){dp[nk*m+q]=nv;par[nk*m+q]=j}}}
    let best=INF,bj=0;for(let j=0;j<m;j++){const v=dp[(N-1)*m+j]+E(j);if(v<best){best=v;bj=j}}
    const o=[];let k=N-1,j=bj;while(j>=0){o.push(j);const p=par[k*m+j];k^=1<<j;j=p}
    return o.reverse();
  }
  let left=new Set(pts.map((_,i)=>i)),cur=-1,o=[];
  while(left.size){let bk,bd=1e18;for(const k of left){const d=D(cur,k);if(d<bd){bd=d;bk=k}}o.push(bk);left.delete(bk);cur=bk}
  const cost=o=>{let c=D(-1,o[0]);for(let i=1;i<o.length;i++)c+=dist(pts[o[i-1]],pts[o[i]]);return c+E(o[o.length-1])};
  let bc=cost(o),imp=true;while(imp){imp=false;for(let i=0;i<m-1;i++)for(let k=i+1;k<m;k++){const t=o.slice(0,i).concat(o.slice(i,k+1).reverse(),o.slice(k+1)),c=cost(t);if(c<bc-1e-9){o=t;bc=c;imp=true}}}
  return o;
}
// prioridades primero, después el resto; los sin ubicación al final
function bestOrder(orders,start){
  const dep=depot(),ret=+cfg().ret===1;start=start||dep;
  const pr=orders.filter(o=>o.prio&&hasLL(o)),rs=orders.filter(o=>!o.prio&&hasLL(o)),nl=orders.filter(o=>!hasLL(o));
  const a=solve(start,pr,null).map(i=>pr[i]);
  const from=a.length?a[a.length-1]:start;
  let b=solve(from,rs,ret?dep:null).map(i=>rs[i]);
  // ida y vuelta: los dos sentidos miden lo mismo; elegir el que entrega antes (arranca por lo cercano)
  if(ret&&b.length>1){const arr=l=>{let p=from,s=0,t=0;for(const o of l){s+=dist(p,o);t+=s;p=o}return t};const r=b.slice().reverse();if(arr(r)<arr(b)-1e-9)b=r}
  return[...a,...b,...nl].map(o=>o.id);
}

/* ============ CHOFER ============ */
const myOrders=()=>ordersArr().filter(o=>same(o.driver,me)&&o.status==='en_reparto');
const myDoneToday=()=>ordersArr().filter(o=>same(o.driver,me)&&(o.status==='entregado'||o.status==='no_entregado')&&o.doneAt>=todayStart()).concat(failEvents().filter(f=>same(f.driver,me)&&f.doneAt>=todayStart()));
function myRoute(){
  const mine=myOrders(),r=D.routes[slug(me)];let ids=(r&&r.ids||[]).filter(id=>mine.some(o=>o.id===id));
  const missing=mine.filter(o=>!ids.includes(o.id));
  if(missing.length&&!ids.length)ids=bestOrder(missing);
  else missing.forEach(o=>{ // lo nuevo se mete en el mejor lugar del recorrido
    if(!hasLL(o)){ids.push(o.id);return}
    const lp=ids.map(id=>!!D.orders[id].prio).lastIndexOf(true),lo=o.prio?0:lp+1,hi=o.prio?lp+1:ids.length,ret=+cfg().ret===1;let best=hi,bc=1e18;
    for(let p=lo;p<=hi;p++){const prev=p===0?depot():D.orders[ids[p-1]],next=p<ids.length?D.orders[ids[p]]:(ret?depot():null);if(!hasLL(prev))continue;
      const add=dist(prev,o)+(next&&hasLL(next)?dist(o,next)-dist(prev,next):0);if(add<bc){bc=add;best=p}}
    ids.splice(best,0,o.id)});
  return ids.map(id=>({id,...D.orders[id]}));
}
function saveRoute(ids,extra){put('routes',slug(me),{...(D.routes[slug(me)]||{}),driver:me,ids,updated:Date.now(),...(extra||{})})}
function myStart(){const r=D.routes[slug(me)];return r&&r.startedAt>=todayStart()?r.startedAt:0}
function timeline(list){const c=cfg(),sp=Math.max(1,+c.speed||30),sm=+c.stopMin||0,st=myStart();let prev=depot(),t=0,km=0;const eta={};
  if(st){const last=myDoneToday().filter(o=>o.doneAt>=st&&hasLL(o)).sort((a,b)=>b.doneAt-a.doneAt)[0];if(last)prev=last}
  list.forEach(o=>{if(hasLL(o)){const d=dist(prev,o);km+=d;t+=d/sp*60;prev=o}eta[o.id]=t;t+=sm});
  if(+c.ret===1&&list.length){const d=dist(prev,depot());km+=d;t+=d/sp*60}return{eta,km,total:t}}
function clock(add){return hhmm(Date.now()+Math.round(add)*60000)}
const hm=m=>{const h=Math.floor(m/60),x=Math.round(m%60);return h?`${h} h ${String(x).padStart(2,'0')}`:`${x} min`};

    const dn=myDoneToday().length;
    B.innerHTML=`<p class="cnt" style="margin:4px 2px 10px">Hola <b>${esc(me)}</b> · <a href="#" id="chMe" style="color:var(--mut)">cambiar</a>${dn?` · hoy hiciste ${dn}`:''}</p>
      ${!mine.length&&dn&&!pe.length?`<div class="empty"><div>🎉</div><p><b>¡Terminaste todo!</b></p></div>`:''}
      <div class="card"><div class="ch"><b>${mine.length?'Sumar pedidos':'Elegí los pedidos que llevás'}</b><button class="sm" id="pkAll">Todos</button></div>
      ${pe.length?pe.map(o=>`<label class="it" style="cursor:pointer"><input type="checkbox" class="chk" data-tk="${o.id}" ${picked.has(o.id)?'checked':''}><div class="b"><div class="t">${o.prio?'<span class="star">★</span> ':''}${ic(o)}${esc(o.name)}</div><div class="d">${esc(o.addr||'')}</div>${msg(o)}${failLine(o)}</div><button class="ghost sm" data-cprio="${o.id}" title="Prioridad" style="font-size:20px">${o.prio?'<span class="star">★</span>':'☆'}</button></label>`).join(''):'<p class="cnt" style="padding:14px">No hay pedidos pendientes.</p>'}</div>`;
    F.innerHTML=`${mine.length?'<button id="pkBack">Volver</button>':''}<button class="pri" id="pkGo" disabled>Llevar y armar recorrido</button>`;
    const upd=()=>{picked=new Set([...B.querySelectorAll('[data-tk]:checked')].map(x=>x.dataset.tk));const n=B.querySelectorAll('[data-tk]:checked').length;$('pkGo').disabled=!n;$('pkGo').textContent=n?`Llevar ${n} y armar recorrido`:'Tildá los pedidos'};
    B.onchange=upd;upd();
    $('chMe').onclick=e=>{e.preventDefault();me='';lset('rep3_me','');render()};
    $('pkAll').onclick=()=>{const all=[...B.querySelectorAll('[data-tk]')],on=all.some(x=>!x.checked);all.forEach(x=>x.checked=on);upd()};
    if($('pkBack'))$('pkBack').onclick=()=>{choView='route';render()};
    $('pkGo').onclick=()=>{
      const ids=[...B.querySelectorAll('[data-tk]:checked')].map(x=>x.dataset.tk).filter(id=>D.orders[id]&&D.orders[id].status==='pendiente');
      if(!ids.length){toast('Esos pedidos ya los tomó otro chofer');return}
      const now=Date.now();ids.forEach(id=>put('orders',id,{...D.orders[id],status:'en_reparto',driver:me,takenAt:now}));
      const cur=myRoute().filter(o=>!ids.includes(o.id)),neu=ids.map(id=>({id,...D.orders[id]}));
      // re-ordenar todo lo que llevo: prioridades primero
      saveRoute(bestOrder(cur.concat(neu)),cur.length?{}:{startedAt:0});picked=new Set();choView='route';toast('Recorrido armado ✓');render();
    };
    return;
  }
  const list=myRoute(),tl=timeline(list),seen=new Set(lget('rep3_seen',[])),fresh=list.filter(o=>o.sentByOffice&&!seen.has(o.id));
  B.innerHTML=(fresh.length?`<div class="banner" style="background:#dbeafe;color:#1e3a8a"><b>🆕 La oficina te agregó:</b> ${fresh.map(o=>ic(o)+esc(o.name)).join(', ')}<br>Ya están en tu recorrido, en el mejor lugar. <button class="sm" id="seenOk" style="margin-top:6px">Entendido</button></div>`:'')+`<p class="cnt" style="margin:4px 2px 10px">🚚 <b>${esc(me)}</b> · ${list.length} pedidos · ${tl.km.toFixed(1)} km · ${hm(tl.total)}</p>
   <div class="card"><div class="ch"><b>Mi recorrido</b><button class="sm" id="reAuto">🔄 Ordenar solo</button></div>
   <div class="it" style="background:var(--bg)"><span class="n" style="background:#111">🏠</span><div class="b"><div class="t">Salida: ${esc(depot().name)}</div></div><span class="cnt">${myStart()?'salió '+hhmm(myStart()):'sin salir'}</span></div>
   ${list.map((o,i)=>`<div class="it"><span class="n">${i+1}</span><div class="b" data-op="${o.id}" style="cursor:pointer"><div class="t">${o.prio?'<span class="star">★</span> ':''}${ic(o)}${esc(o.name)}</div><div class="d">${clock(tl.eta[o.id])} · ${esc(o.addr||'')}${hasLL(o)?'':' · ⚠️ sin ubicación'}</div>${msg(o)}</div><button class="ghost sm" data-cprio="${o.id}" title="Prioridad" style="font-size:20px">${o.prio?'<span class="star">★</span>':'☆'}</button><div class="mv"><button data-up="${i}" ${i?'':'disabled'}>▲</button><button data-dn="${i}" ${i<list.length-1?'':'disabled'}>▼</button></div></div>`).join('')}
   </div><p class="cnt" style="text-align:center">Con ▲▼ cambiás el orden: lo de arriba queda fijo y el resto se reacomoda solo.</p>
   <button class="w" id="addMore">＋ Sumar más pedidos</button>`;
  F.innerHTML=`<button class="ok" id="goDrv">▶ Empezar recorrido</button>`;
  $('goDrv').onclick=()=>{if(!myStart())saveRoute(list.map(o=>o.id),{startedAt:Date.now()});$('drv').classList.add('on');keepAwake();renderDrv()};
  $('addMore').onclick=()=>{choView='pick';render()};
  if($('seenOk'))$('seenOk').onclick=()=>{lset('rep3_seen',[...seen,...fresh.map(o=>o.id)].slice(-300));render()};
  $('reAuto').onclick=()=>{saveRoute(bestOrder(list));toast('Ordenado por el camino más corto')};
}
$('choBody').addEventListener('click',e=>{
  const cp=e.target.closest('[data-cprio]');
  if(cp){e.preventDefault();e.stopPropagation();const id=cp.dataset.cprio,o=D.orders[id];if(!o)return;const np=!o.prio;put('orders',id,{...o,prio:np});
    if(o.status==='en_reparto'&&same(o.driver,me)){saveRoute(bestOrder(myRoute()));toast(np?'★ Con prioridad: va primero en tu recorrido':'Prioridad quitada')}else toast(np?'★ Marcado con prioridad':'Prioridad quitada');return}
  const up=e.target.closest('[data-up]'),dn=e.target.closest('[data-dn]'),op=e.target.closest('[data-op]');
  if(up||dn){const list=myRoute(),ids=list.map(o=>o.id),i=+(up||dn).dataset[up?'up':'dn'],j=up?i-1:i+1;[ids[i],ids[j]]=[ids[j],ids[i]];
    const fix=Math.max(i,j),head=ids.slice(0,fix+1),rest=ids.slice(fix+1).map(id=>({id,...D.orders[id]})),last=D.orders[head[head.length-1]];
    saveRoute(head.concat(bestOrder(rest,hasLL(last)?last:null)))}
  if(op)stopSheet(op.dataset.op);
});
function stopSheet(id){const o=D.orders[id];
  openSheet(`<h3><span>${ic(o)}${esc(o.name)}</span><button class="x" data-close>✕</button></h3><div class="cnt">${esc(o.addr||'')}${o.tel?' · 📞 '+esc(o.tel):''}</div>${msg(o)}
  <div class="row" style="margin-top:12px"><a class="btn gm" href="${navUrl(o)}" target="_blank" rel="noopener">🧭 Google Maps</a><a class="btn wz" href="${wazeUrl(o)}" target="_blank" rel="noopener">Waze</a></div>
  ${contactBtns(o,etaMin(id))}
  <button class="ok w" id="s1" style="margin-top:10px">✅ ${o.kind==='retiro'?'Retirado':'Entregado'}</button><button class="warn w" id="s2" style="margin-top:10px">No pude entregar</button>
  ${hasLL(o)?'':'<button class="w" id="s4" style="margin-top:10px">📍 Estoy en la puerta: guardar ubicación</button><div id="s4m" class="lok"></div>'}
  <button class="ghost w" id="s3" style="margin-top:6px">Devolver a pendientes</button>`);
  if($('s4'))$('s4').onclick=()=>{$('s4m').innerHTML='<span class="cnt">Leyendo GPS…</span>';hereLoc(p=>{const c={lat:p.lat,lng:p.lng};put('orders',id,{...D.orders[id],...c});if(o.cid&&D.clients[o.cid])put('clients',o.cid,{...D.clients[o.cid],...c});$('s4m').innerHTML='<span style="color:var(--ok);font-weight:600">✓ Ubicación guardada para la próxima vez</span>';$('s4').remove()},m=>$('s4m').innerHTML=`<span style="color:#dc2626">${m}</span>`)};
  $('s1').onclick=()=>{finish(id,'entregado');closeSheet()};$('s2').onclick=()=>failSheet(id,closeSheet);
  $('s3').onclick=()=>{put('orders',id,{...D.orders[id],status:'pendiente',driver:'',takenAt:0});closeSheet();toast('Devuelto a pendientes')};
}
function finish(id,status,reason){const o=D.orders[id];if(!o)return;
  if(status==='no_entregado'){put('orders',id,{...o,status:'pendiente',driver:'',takenAt:0,sentByOffice:false,reason:'',doneAt:0,intentos:[...failsOf(o),{driver:nm(o.driver)||me,reason:reason||'',at:Date.now()}]});toast('⚠️ Anotado. Vuelve a pendientes para otro intento',3500);return}
  put('orders',id,{...o,status,reason:reason||'',doneAt:Date.now()});toast('✅ Entregado')}
function failSheet(id,after){
  openSheet(`<h3><span>¿Qué pasó?</span><button class="x" data-close>✕</button></h3>${['No había nadie','Cerrado','No quiso recibir','Dirección equivocada','Otro motivo'].map(r=>`<button class="w" data-rs="${r}" style="margin-top:8px">${r}</button>`).join('')}`);
  $('shp').onclick=e=>{const b=e.target.closest('[data-rs]');if(!b)return;finish(id,'no_entregado',b.dataset.rs);closeSheet();$('shp').onclick=null;if(after)after();renderDrv()};
}

/* modo manejo */
$('drvClose').onclick=()=>{$('drv').classList.remove('on');render()};
function renderDrv(){
  if(!$('drv').classList.contains('on'))return;
  const list=myRoute(),done=myDoneToday(),tot=list.length+done.length;
  $('drvTop').textContent=`${done.length} de ${tot} hechos`;$('drvProg').style.width=(tot?done.length/tot*100:0)+'%';
  if(!list.length){const back=+cfg().ret===1;
    $('drvCard').innerHTML=`<div style="font-size:60px">🎉</div><div class="nm">¡Recorrido terminado!</div>${back?`<div class="ad">Volver a ${esc(depot().name)}</div>`:''}`;
    $('drvBtns').innerHTML=(back?`<a class="btn gm" href="${navUrl(depot())}" target="_blank" rel="noopener">🧭 Volver al local</a>`:'')+`<button id="drvEnd">Cerrar</button>`;
    $('drvEnd').onclick=()=>{$('drv').classList.remove('on');render()};return}
  const o=list[0],tl=timeline(list);
  $('drvCard').innerHTML=`<div class="k">${o.kind==='retiro'?'PRÓXIMO RETIRO':'PRÓXIMA ENTREGA'} · aprox. ${clock(tl.eta[o.id])}</div>${o.prio?'<div class="k" style="color:#d97706">★ PRIORIDAD</div>':''}${o.hora?`<div class="nt" style="background:#dbeafe;color:#1e3a8a">🕐 ${esc(o.hora)}</div>`:''}<div class="nm">${ic(o)}${esc(o.name)}</div>${o.addr?`<div class="ad">${esc(o.addr)}</div>`:''}${o.note?`<div class="nt">📝 ${esc(o.note)}</div>`:''}${o.tel?`<div class="ad">📞 ${esc(o.tel)}</div>`:''}${list[1]?`<div class="k" style="margin-top:14px">Después: ${esc(list[1].name)}</div>`:''}`;
  $('drvBtns').innerHTML=`<div class="row"><a class="btn gm" href="${navUrl(o)}" target="_blank" rel="noopener">🧭 Ir</a><a class="btn wz" href="${wazeUrl(o)}" target="_blank" rel="noopener" style="flex:0 0 30%">Waze</a></div>${contactBtns(o,tl.eta[o.id])}<button class="ok" id="dOk">✅ ${o.kind==='retiro'?'Retirado':'Entregado'}</button><button class="warn sm" id="dNo" style="padding:12px;font-size:16px">No pude entregar</button>`;
  $('dOk').onclick=()=>{finish(o.id,'entregado');renderDrv()};
  $('dNo').onclick=()=>failSheet(o.id);
}

/* ============ render ============ */
function render(){
  if(mode==='ofi'){renderOfi();renderCli();renderMap();if(rol==='oficina')renderBk();if(rol==='cajas')renderCaj()}else{renderCho();renderDrv()}
  if(isDriver&&me&&ready)gpsStart();else gpsStop();updGps();
}
setMode(mode);loadCfg();initData();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
setInterval(()=>{if($('sh').classList.contains('on'))return;if(mode==='ofi'){if(tab==='ped')renderOfi();if(tab==='map')renderMap()}else{renderCho();renderDrv()}},30000);
</script>
</body>
</html>
